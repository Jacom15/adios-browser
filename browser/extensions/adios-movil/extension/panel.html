<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Móvil</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <span id="punto" aria-hidden="true"></span>
    <span id="nombre">Móvil</span>
  </header>
  <main id="vista">
    <div id="aviso">
      <h1 id="aviso-titulo">Conectando con tu móvil…</h1>
      <div id="aviso-texto"></div>
      <button id="reintentar" type="button" hidden>Reintentar</button>
    </div>
    <canvas id="pantalla" tabindex="0" hidden aria-label="Pantalla del móvil"></canvas>
  </main>
  <nav id="botones" hidden>
    <button id="atras" type="button" title="Atrás (o clic derecho)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5v14L6 12z" fill="currentColor"/></svg>
    </button>
    <button id="inicio" type="button" title="Inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button id="recientes" type="button" title="Aplicaciones recientes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </nav>
  <script src="panel.js"></script>
</body>
</html>
